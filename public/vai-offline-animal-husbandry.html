};

// Intake fields per species — mirrors AnimalHusbandryPage.tsx SPECIES_INTAKE
const INTAKE_FIELDS = {
  poultry: [
    { key:'scale', label:'How many sick vs. total flock', placeholder:'e.g. 12 sick out of 80 birds; 3 dead since yesterday', tooltip:'Scale determines urgency immediately. If more than 20% of birds are affected or deaths are rapid, this is HIGH or EMERGENCY.', required:true },

    { key:'vaccination', label:'Vaccination history', placeholder:'e.g. Newcastle vaccinated 6 weeks ago, no Gumboro vaccine, or no vaccinations at all', tooltip:'Unvaccinated flocks are at extreme risk of Newcastle and Gumboro. A vaccinated bird getting sick suggests a different disease or vaccine failure.' },
    { key:'feed_water', label:'Feed and water quality recently', placeholder:'e.g. changed feed supplier last week, water from open creek, litter very wet', tooltip:'Wet litter = Coccidiosis risk. Changed feed = mycotoxin or nutrition problem. Dirty water = bacterial infections.' },

  ],
  goats_sheep: [
    { key:'scale', label:'How many sick vs. total herd', placeholder:'e.g. 5 goats sick out of 18; 1 kid died overnight', tooltip:'PPR spreads fast — 5+ animals in 1-2 days is an emergency. Deaths in kids/lambs escalate urgency.', required:true },
    { key:'main_symptoms', label:'Main symptoms observed', placeholder:'e.g. high fever, eye/nose discharge, bloody diarrhoea, mouth sores, difficulty breathing, rough coat', tooltip:'High fever + discharge + bloody diarrhoea + mouth sores = PPR (EMERGENCY, reportable). Pot-belly + poor coat = worms. Sudden collapse = poisoning or enterotoxaemia.', required:true },

    { key:'new_animals', label:'Any new animals added recently', placeholder:'e.g. bought 3 goats at Oloibiri market last week, no quarantine period', tooltip:'PPR spreads through contact with infected animals. New animals without quarantine are the most common source.', danger:true },

  cattle: [

// DOM HELPER
// ═══════════════════════════════════════════════════════════════════════════════

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    Object.entries(props).forEach(([k, v]) => {
      if (k === 'className') el.className = v;
      else if (k === 'style' && typeof v === 'string') el.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'disabled') { if (v) el.disabled = true; }
      else el.setAttribute(k, v);
    });
  }
  children.flat().forEach(c => { if (c != null && c !== false) el.append(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); });
  return el;
}

// RULE ENGINE
// ═══════════════════════════════════════════════════════════════════════════════

function computeAdvisory() {
  const sp = state.species;
  const intake = state.intake;
  const allText = Object.values(intake).join(' ').toLowerCase();

  const r = {
    urgency: 'low',
    reasons: [],
    immediateActions: [],
    mediumTermActions: [],
    doNot: [],
    referrals: [],
    isolate: false,
    homeCare: [],
    warnings: [],
  };

  const esc = (level) => {
    const order = ['low','medium','high','emergency'];
    if (order.indexOf(level) > order.indexOf(r.urgency)) r.urgency = level;
  };

  // ── POULTRY ────────────────────────────────────────────────────────────────
  if (sp === 'poultry') {
    // Newcastle Disease
    if (allText.includes('twisted neck') || allText.includes('torticollis') || allText.includes('circling') || (allText.includes('paralysis') && allText.includes('wing'))) {
      esc('emergency'); r.reasons.push('NEWCASTLE DISEASE (ND) highly suspected — twisted neck / wing paralysis are classic neurological signs');
      r.isolate = true;
      r.immediateActions.push('ISOLATE sick birds IMMEDIATELY in a separate pen. Do not mix with healthy birds under any circumstances.');
      r.immediateActions.push('Do NOT sell or move any birds off the farm. Newcastle spreads through air, water, and direct contact.');
      r.immediateActions.push('Emergency vaccination of healthy birds: LaSota or Komarov strain via eye-drop if available.');
      r.mediumTermActions.push('After outbreak is controlled: disinfect all equipment, drinkers, feeders with 1:100 bleach solution.');
      r.referrals.push({ who:'Nearest Veterinary Clinic or LGA Veterinary Officer', why:'Newcastle outbreak — confirm diagnosis and source emergency vaccine supply.', urgency:'TODAY' });
      r.doNot.push('Do NOT sell sick or dead birds at market — this will spread Newcastle to other farms.');
    }
    // Gumboro / IBD
    if (allText.includes('gumboro') || (allText.includes('young') && allText.includes('watery') && allText.includes('droop'))) {
      esc('high'); r.reasons.push('Gumboro Disease (IBD) suspected — young birds with watery droppings and depression');
      r.immediateActions.push('Provide electrolytes in drinking water: mix 1 teaspoon sugar + 1/4 teaspoon salt per 1 litre clean water.');
      r.immediateActions.push('Remove wet litter immediately. Replace with dry sawdust or sand.');
      r.mediumTermActions.push('Vaccinate next batch at Day 14 and Day 28 with Gumboro vaccine — crucial for flocks under 6 weeks.');
      r.homeCare.push('Keep brooder temperature correct — cold-stressed chicks cannot recover from Gumboro.');
    }
    // Coccidiosis
    if (allText.includes('bloody') || allText.includes('blood') && allText.includes('dropping')) {
      esc('high'); r.reasons.push('Coccidiosis suspected — bloody droppings are the classic sign');
      r.immediateActions.push('Start Amprolium treatment immediately: available as a feed or water supplement at most agro-vet shops.');
      r.immediateActions.push('Remove all wet litter TODAY. Coccidia thrive in moist conditions — dry litter is the most important prevention.');
      r.mediumTermActions.push('Coccidiostats in starter and grower feed prevent this disease in future flocks.');
    }
    // Fowl pox
    if (allText.includes('pox') || allText.includes('scab') || allText.includes('wart') || (allText.includes('lesion') && (allText.includes('comb') || allText.includes('wattle') || allText.includes('face')))) {
      esc('medium'); r.reasons.push('Fowl Pox suspected — skin lesions on comb, wattle, or around eyes');
      r.immediateActions.push('Isolate affected birds. Apply iodine solution to dry skin lesions with a cotton swab to prevent secondary infection.');
      r.mediumTermActions.push('Vaccinate healthy birds with Fowl Pox vaccine using wing-web method. Pox spreads via mosquitoes and direct contact.');
      r.homeCare.push('Ensure birds have soft, wet feed (mash) as dry throat lesions make eating difficult.');
    }
    // Avian Influenza
    if (allText.includes('avian influenza') || allText.includes('bird flu') || allText.includes('hpai') || (allText.includes('sudden death') && allText.includes('100%')) || (allText.includes('swollen') && allText.includes('head') && allText.includes('rapid'))) {
      esc('emergency'); r.reasons.push('AVIAN INFLUENZA (Bird Flu) suspected — REPORTABLE DISEASE WITH HUMAN HEALTH RISK');
      r.isolate = true;
      r.immediateActions.push('STOP all movement of birds, people, and equipment on and off the farm immediately.');
      r.immediateActions.push('Do NOT handle dead birds without gloves and face covering. Wash hands thoroughly with soap.');
      r.referrals.push({ who:'State Ministry of Agriculture / Federal Dept of Veterinary Services', why:'Suspected HPAI — this is a notifiable disease with human health risk. Must report NOW.', urgency:'IMMEDIATELY' });
      r.doNot.push('Do NOT attempt home treatment. Do NOT sell or slaughter birds without official guidance.');
    }
    // Rapid death, unvaccinated
    if (!allText.includes('vaccin') && (allText.includes('dead') || allText.includes('died')) && (allText.includes('rapid') || allText.includes('sudden') || allText.includes('many'))) {
      esc('emergency'); r.reasons.push('Rapid deaths in unvaccinated flock — Newcastle Disease must be ruled out first');
      r.isolate = true;
      r.immediateActions.push('Isolate all remaining birds from other poultry in the area. Do not share drinkers or feeders.');
      r.referrals.push({ who:'LGA Veterinary Officer', why:'Rapid unexplained deaths in unvaccinated poultry require urgent diagnosis.', urgency:'TODAY' });
    }
  }

  // ── GOATS / SHEEP ──────────────────────────────────────────────────────────
  if (sp === 'goats_sheep') {
    // PPR
    if (allText.includes('ppr') || allText.includes('peste') || (allText.includes('discharge') && allText.includes('mouth sore') && allText.includes('diarrhoea')) || (allText.includes('fever') && allText.includes('sore') && allText.includes('bloody'))) {
      esc('emergency'); r.reasons.push('PPR (Peste des Petits Ruminants) suspected — EMERGENCY, REPORTABLE, HIGHLY CONTAGIOUS');
      r.isolate = true;
      r.immediateActions.push('ISOLATE ALL sick animals NOW. Keep them completely separate from healthy animals.');
      r.immediateActions.push('Do NOT sell, move, or slaughter any animals from this farm until cleared by a vet.');
      r.immediateActions.push('Supportive care: clean fresh water, electrolytes, and soft browse for affected animals while awaiting vet.');
      r.referrals.push({ who:'LGA Veterinary Officer / NVRI', why:'PPR is a notifiable disease. Emergency vaccination of healthy animals must be done by a vet.', urgency:'TODAY — do not wait' });
      r.doNot.push('Do NOT take sick animals to market or sell to a trader — PPR spreads very rapidly and devastates herds.');
    }
    // Haemonchus / worm anaemia
    if (allText.includes('pale') || allText.includes('white gum') || allText.includes('anaemi') || allText.includes('famacha') || (allText.includes('thin') && allText.includes('weak'))) {
      esc('high'); r.reasons.push('Severe anaemia from Haemonchus contortus (barber pole worm) suspected — life-threatening worm burden');
      r.immediateActions.push('Deworm IMMEDIATELY with Albendazole (10 mg/kg) or Levamisole. This is urgent — severe Haemonchus kills within days.');
      r.immediateActions.push('Check gums of ALL animals in the herd — pale/white gums = deworm that animal NOW.');
      r.mediumTermActions.push('Deworm all small ruminants every 3 months. In Bayelsa (high rainfall), worm burdens build faster — consider every 2 months.');
      r.mediumTermActions.push('Rotate pastures if possible — this breaks the worm lifecycle significantly.');
      r.homeCare.push('Supplement with energy (cassava peels, brewers grain) and protein (leaves, legume hay) to speed recovery after deworming.');
    }
    // FMD
    if (allText.includes('blister') || (allText.includes('sore') && allText.includes('foot') && allText.includes('mouth')) || allText.includes('fmd') || allText.includes('foot and mouth')) {
      esc('emergency'); r.reasons.push('FMD (Foot-and-Mouth Disease) suspected — EMERGENCY, REPORTABLE, SPREADS TO CATTLE AND PIGS');
      r.isolate = true;
      r.referrals.push({ who:'State Veterinary Officer', why:'FMD is a notifiable disease affecting all cloven-hoofed animals. Must report to authorities immediately.', urgency:'TODAY' });
      r.doNot.push('Do NOT move animals to market. Do NOT share equipment with neighbouring farms.');
    }
    // Pneumonia
    if (allText.includes('cough') || (allText.includes('breathe') && allText.includes('difficult')) || allText.includes('pneumonia')) {
      esc('high'); r.reasons.push('Pneumonia suspected — respiratory infection in small ruminants');
      r.immediateActions.push('Separate affected animals from healthy ones. Move to dry, draught-free shelter.');
      r.immediateActions.push('Contact vet or animal health worker for antibiotic prescription (Oxytetracycline commonly used).');
      r.homeCare.push('Keep animals warm and dry. Cold, wet conditions make pneumonia much worse and spread faster.');
    }
    // Enterotoxaemia
    if (allText.includes('sudden') && allText.includes('death') && !allText.includes('ppr') && !allText.includes('fmd')) {
      esc('emergency'); r.reasons.push('Enterotoxaemia (pulpy kidney disease) or acute poisoning possible for sudden unexplained deaths');
      r.immediateActions.push('Remove animals from current pasture immediately — possible plant poisoning or sudden nutritional change.');
      r.referrals.push({ who:'LGA Veterinary Officer', why:'Sudden unexplained deaths in small ruminants require post-mortem examination to determine cause.', urgency:'TODAY' });
    }
  }

  // ── CATTLE ────────────────────────────────────────────────────────────────
  if (sp === 'cattle') {
    // CBPP
    if (allText.includes('cbpp') || allText.includes('contagious bovine') || (allText.includes('cough') && allText.includes('fever') && allText.includes('cattle'))) {
      esc('emergency'); r.reasons.push('CBPP (Contagious Bovine Pleuropneumonia) suspected — EMERGENCY, REPORTABLE');
      r.isolate = true;
      r.immediateActions.push('ISOLATE ALL affected cattle immediately. CBPP spreads through respiratory secretions over long distances.');
      r.referrals.push({ who:'Federal Dept of Veterinary Services / State Vet', why:'CBPP is a notifiable disease. Emergency must be reported to authorities immediately.', urgency:'IMMEDIATELY' });
      r.doNot.push('Do NOT move cattle to market or another location. Movement spreads CBPP rapidly across regions.');
    }
    // FMD
    if (allText.includes('blister') || allText.includes('fmd') || allText.includes('foot and mouth') || (allText.includes('sore') && allText.includes('tongue'))) {
      esc('emergency'); r.reasons.push('FMD (Foot-and-Mouth Disease) suspected — EMERGENCY, REPORTABLE');
      r.isolate = true;
      r.referrals.push({ who:'State Veterinary Officer', why:'FMD is a notifiable disease. Must be reported immediately. No treatment — only supportive care and quarantine.', urgency:'IMMEDIATELY' });
      r.doNot.push('Do NOT share water troughs, handling equipment, or vehicles with other farms.');
    }
    // Trypanosomiasis
    if (allText.includes('tryp') || allText.includes('tsetse') || (allText.includes('anaem') && allText.includes('weight loss') && allText.includes('cattle'))) {
      esc('high'); r.reasons.push('Trypanosomiasis (sleeping sickness) suspected — tsetse-transmitted blood parasite, common in Niger Delta');
      r.immediateActions.push('Contact vet for Diminazene Aceturate (Berenil) injection — specific and effective treatment for Trypanosomiasis.');
      r.mediumTermActions.push('Apply pyrethroid-based pour-on or dip every 2 weeks to control tsetse fly burden on animals.');
      r.mediumTermActions.push('Avoid grazing in dense riverine forest during dawn/dusk when tsetse is most active. Open bush is safer.');
    }
    // Tick-borne disease
    if (allText.includes('tick') && (allText.includes('heavy') || allText.includes('many'))) {
      esc('medium'); r.reasons.push('Heavy tick burden — risk of tick-borne diseases (Babesiosis, Anaplasmosis, East Coast Fever)');
      r.immediateActions.push('Apply acaricide (tick dip or pour-on) TODAY. Amitraz or Deltamethrin are commonly available in Nigeria.');
      r.mediumTermActions.push('Establish regular 2-week dipping/pour-on schedule. Tick control is the single most cost-effective cattle health investment.');
    }
    // Mastitis
    if (allText.includes('mastitis') || (allText.includes('udder') && (allText.includes('swoll') || allText.includes('hard') || allText.includes('painful')))) {
      esc('medium'); r.reasons.push('Mastitis suspected — udder infection, milk loss risk');
      r.immediateActions.push('Strip affected quarter(s) completely at every milking — remove all infected milk. This alone significantly speeds recovery.');
      r.immediateActions.push('Contact vet for intramammary antibiotic tube (Cloxacillin-based) — insert at milking for 3-5 days.');
      r.doNot.push('Do NOT feed mastitis milk to calves or humans — contains bacteria and possibly antibiotic residues.');
    }
    // Nutritional
    if (allText.includes('mineral') || allText.includes('no supplement') || (allText.includes('thin') && allText.includes('cattle'))) {
      esc('medium'); r.reasons.push('Nutritional deficiency likely — dry season stress weakening herd');
      r.homeCare.push('Provide mineral block or loose mineral mix (salt + bone meal + trace minerals) ad lib — this is low cost with high returns.');
      r.mediumTermActions.push('Supplement with crop residues, cottonseed cake, or brewers grain during dry season to maintain body condition.');
    }
  }

  // ── PIGS ──────────────────────────────────────────────────────────────────
  if (sp === 'pigs') {
    // ASF — always check first
    const rapidDeaths = allText.includes('dead') && (allText.includes('rapid') || allText.includes('sudden') || allText.includes('many'));
    const asfSigns = allText.includes('purple') || allText.includes('bluish') || allText.includes('reddish skin') || allText.includes('haemorrhage') || allText.includes('bloody diarrhoea');
    const kitchenScraps = allText.includes('food waste') || allText.includes('kitchen scrap') || allText.includes('abattoir') || allText.includes('slaughter');

    if (rapidDeaths || asfSigns || kitchenScraps) {
      esc('emergency'); r.reasons.push('AFRICAN SWINE FEVER (ASF) suspected — EMERGENCY, 100% FATAL, NO CURE, NO VACCINE');
      r.isolate = true;
      r.immediateActions.push('STOP ALL PIG MOVEMENT immediately — no pig, person, or equipment moves on or off the farm.');
      r.immediateActions.push('Separate ALL sick pigs from healthy ones NOW — different pen, different tools, different caretaker if possible.');
      r.immediateActions.push('Do NOT slaughter and sell sick pigs — this spreads ASF through the food chain and is illegal.');
      r.immediateActions.push('If feeding food waste/kitchen scraps: STOP IMMEDIATELY. This is the primary ASF introduction route in Nigeria.');
      r.referrals.push({ who:'State Ministry of Agriculture / LGA Vet Officer', why:'ASF is a notifiable disease. Report IMMEDIATELY — there may be emergency compensation for affected farms.', urgency:'IMMEDIATELY — today, not tomorrow' });
      r.doNot.push('Do NOT sell sick or dead pigs to ANY buyer under any circumstances — spreading ASF is illegal.');
      r.doNot.push('Do NOT share vehicles, boots, or equipment between infected and healthy farms.');
      r.warnings.push('If animals die: bury deeply (>1 metre) or burn on-site. Do NOT take carcasses to market or river.');
    }

    // Swine Erysipelas (good outcome if not ASF)
    if (!asfSigns && !rapidDeaths && (allText.includes('raised') || allText.includes('diamond') || (allText.includes('red patch') && !allText.includes('bluish')))) {
      esc('high'); r.reasons.push('Swine Erysipelas possible — raised reddish diamond-shaped skin patches (very different from ASF)');
      r.immediateActions.push('Contact vet immediately for Penicillin injection — Swine Erysipelas responds very well to early antibiotic treatment.');
      r.immediateActions.push('Isolate affected pig. Provide fresh water and a cool resting area — fever causes dehydration.');
      r.homeCare.push('If Erysipelas is confirmed: recovery is typically complete within 5-7 days with correct treatment.');
    }

    // PRRS / Respiratory
    if (allText.includes('cough') || allText.includes('sneez') || (allText.includes('breathe') && allText.includes('difficult'))) {
      esc('high'); r.reasons.push('Respiratory disease suspected in pigs — PRRS or bacterial pneumonia');
      r.immediateActions.push('Separate coughing pigs immediately. Respiratory infections spread very fast in crowded pig pens.');
      r.mediumTermActions.push('Improve ventilation in pig houses — poor airflow is the primary driver of respiratory disease in pigs.');
      r.referrals.push({ who:'LGA Veterinary Officer', why:'Pig respiratory diseases require proper diagnosis to choose the correct antibiotic treatment.', urgency:'Within 48 hours' });
    }

    // Scours / diarrhoea in piglets
    if (allText.includes('scour') || (allText.includes('diarrhoea') && (allText.includes('piglet') || allText.includes('weaner')))) {
      esc('medium'); r.reasons.push('Piglet scours (diarrhoea) — common but can be rapidly fatal in young pigs through dehydration');
      r.immediateActions.push('Provide oral rehydration: 1 litre clean water + 1 teaspoon salt + 1 tablespoon sugar. Force-feed if necessary.');
      r.immediateActions.push('Keep piglets warm and dry — cold + dehydration kills very fast in neonates.');
      r.mediumTermActions.push('Ensure sow is vaccinated against E. coli and rotavirus before farrowing. Colostrum intake in first 6 hours is critical.');
    }

    // Mouldy feed
    if (allText.includes('mould') || allText.includes('mold') || allText.includes('musty')) {
      esc('medium'); r.reasons.push('Mycotoxin contamination from mouldy feed suspected');
      r.immediateActions.push('REMOVE mouldy feed IMMEDIATELY. Dispose of it away from pigs, poultry, and other animals.');
      r.doNot.push('Do NOT feed mouldy maize, cassava, or any mouldy grain to pigs — mycotoxins cause reproductive failure, liver damage, and immunosuppression.');
    }
  }

  // ── UNIVERSAL: fallback if no specific condition matched ─────────────────
  if (r.reasons.length === 0) {
    r.reasons.push('No specific emergency condition identified from the information provided');
    r.homeCare.push('Monitor the animals closely. Record daily: number sick, symptoms, deaths, and any changes.');
    r.mediumTermActions.push('If condition worsens or new animals are affected, seek veterinary advice immediately.');
    r.referrals.push({ who:'Local LGA Veterinary Officer', why:'Baseline check — bring a detailed record of symptoms, onset, and management history.', urgency:'Within the week' });
  }

  return r;
}

// REFERRAL NOTE

function makeReferralNote() {
  const f = state.farmer;
  const sp = state.species;
  const res = state.result;
  const spConf = SPECIES_CONFIG[sp] || {};
  const today = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  return `ANIMAL HUSBANDRY CONSULTATION RECORD
──────────────────────────────
Date: ${today}
Farmer: ${f.name} · ${f.village}${f.phone?'\nPhone: '+f.phone:''}
Species: ${spConf.emoji||''} ${spConf.label||sp}

SYMPTOMS REPORTED:
${Object.entries(state.intake).filter(([,v])=>v&&v.trim()).map(([k,v])=>k.toUpperCase().replace(/_/g,' ')+': '+v).join('\n')}

ADVISORY OUTCOME:
URGENCY: ${res.urgency.toUpperCase()}
${res.reasons[0]||''}
${res.isolate?'\n⚠ ISOLATION REQUIRED — separate sick animals from healthy ones NOW':''}

REFERRALS: ${res.referrals.map(r=>r.who).join('; ')||'None'}

Advisor: Community Animal Husbandry Ambassador
Programme: vAI Community Impact, ${f.village}
──────────────────────────────`;
}

function renderFarmer() {
  const el = h('div', null);
  el.append(h('div', { className:'card' },
    h('div', { className:'card-title' }, '🐄 Farmer Details'),
    h('div', { className:'card-subtitle' }, 'Who are you consulting with today?'),
    h('div', { className:'field' },
      h('label', { className:'label' }, 'Farmer Name', h('span', { className:'req' }, ' *')),
      h('input', { className:'input', type:'text', placeholder:'e.g. Mr Emeka Okon', value:state.farmer.name, onInput:e=>{ state.farmer.name=e.target.value; render(); } })
    ),
    h('div', { className:'field' },
      h('label', { className:'label' }, 'Village'),
      h('select', { className:'select', onChange:e=>{ state.farmer.village=e.target.value; render(); } },
        ...VILLAGES.map(v => { const opt=h('option',{value:v},v); if(v===state.farmer.village) opt.selected=true; return opt; })
      )
    ),
    h('div', { className:'field' },
      h('label', { className:'label' }, 'Phone (optional)'),
      h('input', { className:'input', type:'tel', placeholder:'e.g. 08012345678', value:state.farmer.phone, onInput:e=>{ state.farmer.phone=e.target.value; } })
    ),
    h('div', { className:'field' },
      h('label', { className:'label' }, 'Notes (optional)'),
      h('textarea', { className:'textarea', rows:'2', placeholder:'e.g. second visit, referred by health navigator...', onInput:e=>{ state.farmer.notes=e.target.value; } }, state.farmer.notes)
    )
  ));
  return el;
}

function renderSpecies() {
  const el = h('div', null);
  el.append(h('div', { className:'card' },
    h('div', { className:'card-title' }, '🐾 Select Species'),
    h('div', { className:'card-subtitle' }, 'Which animal needs assessment?'),
    h('div', { className:'btn-group', style:'flex-direction:column;' },
      ...Object.entries(SPECIES_CONFIG).map(([key, sp]) => {
        const active = state.species === key;
        const btn = h('button', {
          type:'button',
          className:'btn-choice' + (active?' active':''),
          style:'text-align:left;display:flex;align-items:center;gap:10px;',
          onClick:()=>{ state.species=key; render(); }
        },
          h('span', { style:'font-size:24px;' }, sp.emoji),
          h('div', null,
            h('div', { style:'font-weight:700;font-size:14px;' }, sp.label),
            h('div', { style:'font-size:11px;color:var(--gray-400);font-weight:400;' }, sp.desc)
          )
        );
        return btn;
      })
    )
  ));
  return el;
}

function renderIntake() {
  const fields = INTAKE_FIELDS[state.species] || [];
  const el = h('div', null);

  // Emergency context banner for pigs
  if (state.species === 'pigs') {
    el.append(h('div', { className:'alert alert-red' },
      h('span', { className:'alert-icon' }, '🚨'),
      h('div', null,
        h('div', { className:'alert-title' }, 'ASF Risk — Read Before Proceeding'),
        h('div', { className:'alert-text' }, 'If pigs are showing rapid deaths, reddish/bluish skin patches, or bloody diarrhoea — suspect African Swine Fever immediately. Fill out the form and get the advisory.')
      )
    ));
  }

  el.append(h('div', { className:'card' },
    h('div', { className:'card-title' }, SPECIES_CONFIG[state.species].emoji + ' Clinical Intake — ' + SPECIES_CONFIG[state.species].label),
    h('div', { className:'card-subtitle' }, 'Complete as many fields as possible. Required fields marked *'),
    ...fields.map(field => {
      const tipId = 'tip_' + field.key;
      const open = state.openTooltip === tipId;
      const container = h('div', { className:'field' });

      const labelEl = h('label', { className:'label' },
        field.label,
        field.required ? h('span', { className:'req' }, ' *') : null,
        ' ',
        h('button', { type:'button', className:'tooltip-btn', onClick:()=>{ state.openTooltip = open ? null : tipId; render(); } }, open ? '▲ hide tip' : '💡 tip')
      );
      container.append(labelEl);

      if (open) container.append(h('div', { className:'tooltip-box' }, field.tooltip));

      if (field.danger) {
        container.append(h('div', { style:'font-size:11px;color:var(--red-600);font-weight:600;margin-bottom:4px;' }, '⚠ Danger indicator — answer carefully'));
      }

      const ta = h('textarea', {
        className:'textarea', rows:'3', placeholder:field.placeholder,
        onInput:e=>{ state.intake[field.key]=e.target.value; }
      }, state.intake[field.key]||'');
      container.append(ta);
      return container;
    })
  ));
  return el;
}

function renderResult() {
  const res = state.result;
  const f = state.farmer;
  const sp = SPECIES_CONFIG[state.species];
  const els = [];

  // Emergency isolation banner
  if (res.isolate) {
    els.push(h('div', { className:'alert alert-red' },
      h('span', { className:'alert-icon' }, '🚨'),
      h('div', null,
        h('div', { className:'alert-title' }, 'ISOLATION REQUIRED — Do This First'),
        h('div', { className:'alert-text' }, 'Separate ALL sick animals from healthy ones IMMEDIATELY. Use a different pen, different water, different tools. Stop all movement of animals on and off this farm NOW.')
      )
    ));
  }

  // Urgency banner
  const urgencyIcons = { emergency:'🔴 EMERGENCY', high:'🟠 HIGH URGENCY', medium:'🟡 MEDIUM URGENCY', low:'🟢 LOW URGENCY' };
  const urgencyDesc = { emergency:'STOP all animal movement. Isolate. Report to veterinary authority immediately.', high:'Act today — deaths or rapid spread requires urgent vet contact.', medium:'Act this week — isolate, check vaccines, contact animal-health worker.', low:'Monitor and improve care — no immediate danger.' };
  els.push(h('div', { className:'result-banner ' + res.urgency },
    h('div', { className:'result-level' }, urgencyIcons[res.urgency]||res.urgency),
    h('div', { className:'result-patient' }, sp.emoji + ' ' + sp.label + ' · ' + f.name + ' · ' + f.village),
    h('div', { className:'result-reason' }, urgencyDesc[res.urgency]||''),
    ...res.reasons.map(r => h('div', { className:'result-reason', style:'margin-top:4px;font-size:12px;' }, '• ' + r))
  ));

  // Immediate actions
  if (res.immediateActions.length) {
    els.push(h('div', { className:'card' },
      h('div', { className:'result-section-title' }, '🚨 Immediate Actions Required'),
      ...res.immediateActions.map(a => h('div', { className:'result-item action' }, '▶ ' + a))
    ));
  }

  // Referrals
  if (res.referrals.length) {
    els.push(h('div', { className:'card' },
      h('div', { className:'result-section-title' }, '📞 Seek Veterinary Help'),
      ...res.referrals.map(r => h('div', { className:'result-item referral' },
        h('div', { style:'font-weight:700;font-size:13px;' }, r.who),
        h('div', { style:'font-size:12px;margin-top:2px;color:var(--gray-600);' }, r.why),
        h('div', { style:'font-size:11px;margin-top:3px;font-weight:700;color:var(--red-600);' }, '⏰ ' + r.urgency)
      ))
    ));
  }

  // Medium term
  if (res.mediumTermActions.length) {
    els.push(h('div', { className:'card' },
      h('div', { className:'result-section-title' }, '📋 Follow-Up Actions (This Week)'),
      ...res.mediumTermActions.map(a => h('div', { className:'result-item rec' }, '✓ ' + a))
    ));
  }

  // Home care
  if (res.homeCare.length) {
    els.push(h('div', { className:'card' },
      h('div', { className:'result-section-title' }, '🏡 Home Care'),
      ...res.homeCare.map(hc => h('div', { className:'result-item home' }, '✓ ' + hc))
    ));
  }

  // Do not
  if (res.doNot.length) {
    els.push(h('div', { className:'card' },
      h('div', { className:'result-section-title', style:'color:var(--red-700);' }, '🚫 Do NOT'),
      ...res.doNot.map(d => h('div', { className:'result-item warning' }, '✗ ' + d))
    ));
  }

  // Warning signs
  if (res.warnings.length) {
    els.push(h('div', { className:'card' },
      h('div', { className:'result-section-title', style:'color:var(--red-700);' }, '⚠️ Warning Signs — Return If:'),
      ...res.warnings.map(w => h('div', { className:'result-item warning' }, '🚨 ' + w))
    ));
  }

  // Referral note (collapsible)
  const noteCard = h('div', { className:'card' });
  noteCard.append(h('button', { type:'button', style:'width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;cursor:pointer;padding:0;', onClick:()=>{ state.showReferral=!state.showReferral; render(); } },
    h('div', { className:'result-section-title', style:'margin:0;' }, '📄 Consultation Record'),
    h('span', { style:'color:var(--gray-400);' }, state.showReferral ? '▾' : '▸')
  ));
  if (state.showReferral) noteCard.append(h('pre', { className:'referral-note', style:'margin-top:10px;' }, makeReferralNote()));
  els.push(noteCard);

  // Save
  const saveCard = h('div', { className:'card' });
  const isOnline = navigator.onLine;
  const notConfigured = SYNC_CONFIG.syncKey === 'CHANGE_ME_BEFORE_DEPLOY';

  if (!state.saved) {
    if (isOnline && !notConfigured) {
      const dbBtn = h('button', { type:'button', className:'btn-save', onClick:saveToDatabase }, state.savingToDb ? '⏳ Saving to vAI Database…' : '☁️ Save to vAI Database');
      dbBtn.disabled = state.savingToDb;
      saveCard.append(dbBtn);
      if (state.saveError) saveCard.append(h('div', { style:'margin:8px 0;padding:10px;background:var(--red-50);border-radius:8px;font-size:12px;color:var(--red-700);' }, '⚠️ ' + state.saveError));
      saveCard.append(h('button', { type:'button', className:'btn-reset', style:'margin-top:8px;', onClick:saveCurrent }, '💾 Save Offline Instead'));
    } else {
      saveCard.append(h('button', { type:'button', className:'btn-save', onClick:saveCurrent }, '💾 Save Offline'));
      saveCard.append(h('div', { style:'font-size:12px;color:var(--amber-700);text-align:center;margin-top:8px;' }, '📡 No connection — consultation will sync to vAI database when back online.'));
    }
  } else {
    if (state.saveMode === 'database') {
      saveCard.append(h('div', { className:'alert alert-green', style:'margin:0 0 8px;' },
        h('span', { className:'alert-icon' }, '✅'),
        h('div', null, h('div', { className:'alert-title' }, 'Saved to vAI Database'), h('div', { className:'alert-text' }, 'Consultation is in the NextVillage platform and available for follow-up.'))
      ));
    } else {
      saveCard.append(h('div', { className:'alert alert-green', style:'margin:0 0 8px;' },
        h('span', { className:'alert-icon' }, '💾'),
        h('div', null, h('div', { className:'alert-title' }, 'Saved to device'), h('div', { className:'alert-text' }, getPending() + ' consultation' + (getPending()!==1?'s':'') + ' pending sync. Tap ⬆ when online to upload.'))
      ));
    }
  }
  saveCard.append(h('button', { type:'button', className:'btn-reset', style:'margin-top:8px;', onClick:resetAll }, 'Start New Consultation'));
  els.push(saveCard);

  els.push(h('div', { className:'disclaimer' }, '⚠️ ANIMAL HUSBANDRY ADVISORY SUPPORT ONLY — Rule-based recommendations. For reportable disease outbreaks (ASF, PPR, FMD, CBPP, HPAI), contact the State Ministry of Agriculture or Federal Dept of Veterinary Services immediately. The advisor must use their own judgement and training.\nBuilt for vAI Community Impact Programme, Oloibiri & Ibiade.'));

  return h('div', null, ...els);
}

// ═══════════════════════════════════════════════════════════════════════════════
// LOCAL STORAGE
// ═══════════════════════════════════════════════════════════════════════════════

const STORAGE_KEY = 'vai_offline_animal_consultations';
function loadSaved() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; } catch{ return []; } }

function saveCurrent() {
  const list = loadSaved();
  list.unshift({
    id:'animal_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    ts:new Date().toISOString(),
    farmer:state.farmer,
    species:state.species,
    intake:state.intake,
    result:state.result,
    synced:false,
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  state.saved = true;
  state.saveMode = 'offline';
  updatePendingBadge();
  render();
}

async function saveToDatabase() {
  state.savingToDb = true;
  state.saveError = null;
  render();
  try {
    const payload = {
      farmer:state.farmer,
      species:state.species,
      intake:state.intake,
      result:state.result,
      ts:new Date().toISOString(),
      syncKey:SYNC_CONFIG.syncKey,
      navigatorUserId:SYNC_CONFIG.navigatorUserId,
    };
    const resp = await fetch(SYNC_CONFIG.functionUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ consultations:[{ ...payload, id:'animal_'+Date.now()+'_direct', synced:false }] }),
    });
    if (!resp.ok) throw new Error('Server error ' + resp.status);
    state.saved = true;
    state.saveMode = 'database';
  } catch(e) {
    state.saveError = 'Could not save to vAI database: ' + e.message + '. Use offline save instead.';
  } finally {
    state.savingToDb = false;
    render();
  }
}

function getPending() { return loadSaved().filter(a=>!a.synced).length; }
function updatePendingBadge() {
  const n = getPending();
  const btn = document.getElementById('btn-sync-header');
  const ct = document.getElementById('pending-count');
  if (n>0) { btn.classList.remove('hidden'); ct.textContent=n; } else { btn.classList.add('hidden'); }
}

// ═══════════════════════════════════════════════════════════════════════════════
// SYNC ENGINE
// ═══════════════════════════════════════════════════════════════════════════════

let syncPanelOpen = false;
let syncing = false;

function openSyncPanel() { syncPanelOpen=true; renderSyncPanel(); }
function closeSyncPanel() { syncPanelOpen=false; const el=document.getElementById('sync-overlay'); if(el) el.remove(); }

function renderSyncPanel() {
  let overlay = document.getElementById('sync-overlay');
  if (overlay) overlay.remove();
  if (!syncPanelOpen) return;

  const saved = loadSaved();
  const pending = saved.filter(a=>!a.synced);
  const synced = saved.filter(a=>a.synced);
  const isOnline = navigator.onLine;

  overlay = h('div', { className:'sync-overlay', id:'sync-overlay', onClick:e=>{ if(e.target===overlay) closeSyncPanel(); } },
    h('div', { className:'sync-panel', onClick:e=>e.stopPropagation() },
      h('div', { className:'sync-title' }, '📡 Sync Animal Consultations'),
      h('div', { className:'sync-sub' }, isOnline ? `You are ONLINE. ${pending.length} consultation${pending.length!==1?'s':''} ready to sync.` : 'You are OFFLINE. Connect to sync.'),
      ...(pending.length>0 ? [
        h('div', { className:'section-label', style:'margin-top:8px;' }, 'Pending Upload'),
        ...pending.map(a=>h('div', { className:'sync-item' },
          h('div', null,
            h('div', { className:'name' }, a.farmer?.name||'Unknown'),
            h('div', { className:'meta' }, (SPECIES_CONFIG[a.species]?.emoji||'🐾')+' '+(a.result?.urgency||'').toUpperCase()+' · '+(a.farmer?.village||'')+' · '+new Date(a.ts).toLocaleDateString())
          ),
          h('span', { className:'status '+(a._syncError?'error':'pending') }, a._syncError?'✗ Error':'⏳ Pending')
        ))
      ] : [h('div', { style:'text-align:center;padding:20px;color:var(--gray-400);font-size:13px;' }, '✅ All consultations synced!')]),
      ...(synced.length>0 ? [
        h('div', { className:'section-label', style:'margin-top:12px;' }, 'Recently Synced'),
        ...synced.slice(0,5).map(a=>h('div', { className:'sync-item' },
          h('div', null, h('div', { className:'name' }, a.farmer?.name||'Unknown'), h('div', { className:'meta' }, new Date(a.ts).toLocaleDateString())),
          h('span', { className:'status synced' }, '✓ Synced')
        ))
      ] : []),
      isOnline&&pending.length>0
        ? h('button', { className:'btn-sync go', id:'btn-do-sync', disabled:syncing, onClick:doSync }, syncing?'⏳ Syncing…':`⬆ Sync ${pending.length} Consultation${pending.length!==1?'s':''}`)
        : (!isOnline&&pending.length>0 ? h('div', { style:'text-align:center;padding:12px;color:var(--amber-700);font-size:13px;font-weight:600;' }, '📡 No internet. Consultations are safe on your device.') : null),
      h('button', { className:'btn-sync close', onClick:closeSyncPanel }, 'Close')
    )
  );
  document.body.appendChild(overlay);
}

async function doSync() {
  if (syncing) return;
  syncing = true;
  renderSyncPanel();
  const saved = loadSaved();
  const pending = saved.filter(a=>!a.synced);
  try {
    const response = await fetch(SYNC_CONFIG.functionUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ consultations:pending.map(a=>({...a,syncKey:SYNC_CONFIG.syncKey,navigatorUserId:SYNC_CONFIG.navigatorUserId})) }),
    });
    if (!response.ok) throw new Error('Server '+response.status);
    const data = await response.json();
    const syncedIds = new Set((data.synced||[]).map(s=>s.id));
    const updated = saved.map(a=>syncedIds.has(a.id)?{...a,synced:true}:a);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
    updatePendingBadge();
  } catch(e) {
    pending.forEach(a=>{ a._syncError=e.message; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  } finally {
    syncing=false;
    renderSyncPanel();
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════════════

function render() {
  // Step bar
  const bar = document.getElementById('step-bar');
  bar.innerHTML = '';
  STEPS.forEach((s,i) => {
    const cls = i===state.step?'step-pill current':i<state.step?'step-pill done':'step-pill upcoming';
    bar.append(h('button',{className:cls,type:'button',disabled:i>state.step+1,onClick:()=>{ if(i<state.step) goStep(i); }},(i<state.step?'✓ ':'')+s.label));
    if (i<STEPS.length-1) bar.append(h('div',{className:'step-line'+(i<state.step?' done':'')}));
  });

  // Content
  const content = document.getElementById('content');
  content.innerHTML = '';
  const renderers = [renderFarmer, renderSpecies, renderIntake, renderResult];
  content.append(renderers[state.step]());

  // Footer
  const footer = document.getElementById('footer');
  const inner = document.getElementById('footer-inner');
  if (state.step===3) { footer.style.display='none'; } else {
    footer.style.display = '';
    inner.innerHTML = '';
    if (state.step>0) inner.append(h('button',{type:'button',className:'btn-nav secondary',onClick:goBack},'← Back'));
    const labels = ['Next ▶','Next ▶','Run Advisory ▶'];
    const disabled = (state.step===0 && !state.farmer.name.trim()) ||
                     (state.step===1 && !state.species) ||
                     (state.step===2 && !(INTAKE_FIELDS[state.species]||[]).filter(f=>f.required).every(f=>state.intake[f.key]?.trim()));
    inner.append(h('button',{type:'button',className:'btn-nav primary',disabled,onClick:goNext},labels[state.step]));
  }

  if (state._lastStep!==state.step) { window.scrollTo({top:0,behavior:'smooth'}); state._lastStep=state.step; }
}

function goStep(i) { state.step=i; render(); }
function goNext() {
  if (state.step===2) { state.result=computeAdvisory(); state.step=3; }
  else if (state.step<3) { state.step++; }
  render();
}
function goBack() { if(state.step>0) { state.step--; render(); } }

function resetAll() {
  state = {
    step:0, farmer:{name:'',village:'Oloibiri',phone:'',animals:[],notes:''},
    species:null, intake:{}, result:null, saved:false, saveMode:null,
    savingToDb:false, saveError:null, openTooltip:null, showReferral:false, _lastStep:-1,
  };
  render();
}

function updateConnectivity() {
  const badge = document.getElementById('badge-connectivity');
  if (navigator.onLine) { badge.className='badge-online'; badge.innerHTML='🟢 Online'; }
  else { badge.className='badge-offline'; badge.innerHTML='📡 Offline'; }
}
window.addEventListener('online', updateConnectivity);
window.addEventListener('offline', updateConnectivity);

updatePendingBadge();
updateConnectivity();
render();
</script>
